<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}测试报告平台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">测开平台</a>
    <nav>
      <a href="{{ url_for('index') }}">仪表盘</a>
      <a href="{{ url_for('runs') }}">运行记录</a>
      <a href="{{ url_for('cases') }}">用例列表</a>
      <a href="{{ url_for('import_page') }}">导入报告</a>
      <a href="{{ url_for('api_runs') }}">API</a>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
